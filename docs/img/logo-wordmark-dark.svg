  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <!-- sweep trails -->
  <path d="M44 196 C 76 214, 120 214, 150 200" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="10" stroke-linecap="round"/>
  <path d="M40 166 C 60 180, 84 186, 104 184" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="10" stroke-linecap="round"/>
