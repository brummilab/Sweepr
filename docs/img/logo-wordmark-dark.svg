<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160" role="img" aria-label="Sweepr">
  <svg x="0" y="0" width="160" height="160" viewBox="0 0 256 256">
  <defs>
