ShortDescription: Deep clean, uninstall apps, optimize, analyze disk, and monitor Windows from the terminal.
Description: |-
  Sweepr is a free, open-source command-line toolkit for Windows maintenance.
  It cleans caches and temporary files, removes apps together with their leftovers,
  runs bounded maintenance tasks, explores disk usage, and shows live system status.
  Every destructive command can be previewed with --dry-run.
